<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File</title>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        #drop-area {
            border: 2px dashed #00ff00;
            border-radius: 20px;
            width: 300px;
            height: 200px;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        #drop-area:hover {
            background-color: rgba(0, 255, 0, 0.1);
        }
        #fileElem {
            display: none;
        }
        #file-label {
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Fitur Drag-and-Drop Upload</h1>
    <div id="drop-area">
        <form class="my-form">
            <p>Seret dan lepas file di sini atau <label for="fileElem">klik untuk memilih file</label>.</p>
            <input type="file" id="fileElem" multiple>
        </form>
    </div>

    <script>
        let dropArea = document.getElementById('drop-area');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        dropArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dataTransfer = e.dataTransfer;
            let files = dataTransfer.files;
            console.log(files);
        }
    </script>

    <footer>
        <p>Dokumentasi: Halaman ini memungkinkan pengguna untuk mengunggah file dengan cara diseret dan dijatuhkan atau dengan mengklik untuk memilih file.</p>
    </footer>
</body>
</html>
